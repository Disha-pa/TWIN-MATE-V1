{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Reset Password</h2>
        <p class="auth-subtitle">Choose a new password (at least 6 characters).</p>
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            {% if csrf_token is defined and csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}
            <label for="password">New password</label>
            <input id="password" type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password" name="confirm_password" placeholder="Repeat password" minlength="6" required>
            <button type="submit">Update Password</button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to Log In</a></p>
    </div>
</div>
{% endblock %}
