{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Log In</h2>
        <p class="auth-subtitle">Enter your email and password.</p>
        <form method="POST" action="{{ url_for('auth.login') }}">
            {% if csrf_token is defined and csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}
            <label for="email">Email</label>
            <input id="email" type="text" name="email" placeholder="you@gmail.com" value="{{ email or '' }}" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Your password" required>
            <p class="auth-switch" style="text-align:right; margin-top:6px;">
                <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
            </p>
            <button type="submit">Log In</button>
        </form>
        <p class="auth-switch">New here? <a href="{{ url_for('auth.signup') }}">Create account</a></p>
    </div>
</div>
{% endblock %}
