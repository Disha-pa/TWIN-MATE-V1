<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b5d8ff">
    <title>TWIN MATE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing-page">
    <div class="landing-shell">
        <h1 class="landing-logo">TWIN MATE</h1>

        <div class="landing-robot" aria-hidden="true">
            <div class="robot-hi">Hi!</div>
            <svg class="robot-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
                <!-- Antenna -->
                <line class="robot-antenna" x1="100" y1="28" x2="100" y2="48" stroke="#7aa8d8" stroke-width="4" stroke-linecap="round"/>
                <circle class="robot-antenna-tip" cx="100" cy="22" r="8" fill="#ff8ec8"/>

                <!-- Head -->
                <rect x="55" y="48" width="90" height="70" rx="18" fill="#e8f2ff" stroke="#9bc4ea" stroke-width="3"/>
                <circle class="robot-eye" cx="80" cy="78" r="8" fill="#4a6fa5"/>
                <circle class="robot-eye" cx="120" cy="78" r="8" fill="#4a6fa5"/>
                <circle cx="83" cy="75" r="2.5" fill="#fff"/>
                <circle cx="123" cy="75" r="2.5" fill="#fff"/>
                <path d="M85 98 Q100 110 115 98" fill="none" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/>

                <!-- Body -->
                <rect x="60" y="125" width="80" height="70" rx="16" fill="#d4e8ff" stroke="#9bc4ea" stroke-width="3"/>
                <rect x="78" y="142" width="44" height="28" rx="8" fill="#b5d8ff"/>
                <circle cx="100" cy="156" r="6" fill="#ff8ec8"/>

                <!-- Left arm (static) -->
                <g class="robot-arm-left">
                    <rect x="28" y="135" width="28" height="14" rx="7" fill="#c5ddf5" stroke="#9bc4ea" stroke-width="2"/>
                </g>

                <!-- Right arm (waving) -->
                <g class="robot-arm-wave">
                    <rect x="144" y="128" width="42" height="14" rx="7" fill="#c5ddf5" stroke="#9bc4ea" stroke-width="2"/>
                    <circle cx="190" cy="135" r="10" fill="#e8f2ff" stroke="#9bc4ea" stroke-width="2"/>
                </g>

                <!-- Legs -->
                <rect x="72" y="195" width="18" height="18" rx="6" fill="#b5d8ff" stroke="#9bc4ea" stroke-width="2"/>
                <rect x="110" y="195" width="18" height="18" rx="6" fill="#b5d8ff" stroke="#9bc4ea" stroke-width="2"/>
            </svg>
        </div>

        <a class="landing-cta" href="{{ url_for('auth.signup') }}">LET'S GOOO</a>
    </div>
</body>
</html>
