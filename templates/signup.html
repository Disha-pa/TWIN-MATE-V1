{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join Twin Mate — track goals and build habits.</p>
        <form method="POST" action="{{ url_for('auth.signup') }}">
            {% if csrf_token is defined and csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}
            <label for="email">Email</label>
            <input id="email" type="text" name="email" placeholder="you@gmail.com" value="{{ email or '' }}" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
            <button type="submit">Create Account</button>
        </form>
        <p class="auth-switch">Have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
